name: EXP103 GFX1013 dot probe build

on:
  pull_request:
    branches:
      - v3
    paths:
      - 'experiments/EXP-103-GFX1013-DOT-SILICON/**'
      - 'bc250-fsr4-v3.patch'
      - 'Dockerfile'
      - 'mesa-commit.txt'
      - '.github/workflows/exp103-probe-build.yml'

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Enable buildx
        uses: docker/setup-buildx-action@v3

      - name: Build EXP103 disposable RADV
        run: |
          set -euxo pipefail
          bash experiments/EXP-103-GFX1013-DOT-SILICON/build-exp103-anywhere.sh

      - name: Static probe-kit validation
        run: |
          set -euxo pipefail
          test -s experiments/EXP-103-GFX1013-DOT-SILICON/libvulkan_radeon-exp103.so
          sha256sum -c experiments/EXP-103-GFX1013-DOT-SILICON/libvulkan_radeon-exp103.so.sha256
          grep -q 'BC250_DOT_PROBE' experiments/EXP-103-GFX1013-DOT-SILICON/exp103-gfx1013-dot-probe.patch
          grep -q 'v_dot4_u32_u8' experiments/EXP-103-GFX1013-DOT-SILICON/run-exp103-4x8.sh
          grep -q 'v_dot2_i32_i16' experiments/EXP-103-GFX1013-DOT-SILICON/run-exp103-dot2.sh
          python3 -m py_compile \
            experiments/EXP-103-GFX1013-DOT-SILICON/gen_dot2_kernels.py \
            experiments/EXP-103-GFX1013-DOT-SILICON/make_bench_dot2.py

      - name: Package probe
        run: |
          set -euxo pipefail
          mkdir -p artifacts/EXP103
          cp experiments/EXP-103-GFX1013-DOT-SILICON/libvulkan_radeon-exp103.so* artifacts/EXP103/
          cp experiments/EXP-103-GFX1013-DOT-SILICON/run-exp103-4x8.sh artifacts/EXP103/
          cp experiments/EXP-103-GFX1013-DOT-SILICON/run-exp103-dot2.sh artifacts/EXP103/
          cp experiments/EXP-103-GFX1013-DOT-SILICON/gen_dot2_kernels.py artifacts/EXP103/
          cp experiments/EXP-103-GFX1013-DOT-SILICON/make_bench_dot2.py artifacts/EXP103/
          cp experiments/EXP-103-GFX1013-DOT-SILICON/README.md artifacts/EXP103/

      - uses: actions/upload-artifact@v4
        with:
          name: exp103-gfx1013-dot-probe
          path: artifacts/EXP103/
          if-no-files-found: error
          compression-level: 0
