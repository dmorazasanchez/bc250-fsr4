name: EXP109 RGP pstate shim

on:
  pull_request:
    branches: [v3]
    paths:
      - 'experiments/EXP-109-RGP-PSTATE-SHIM/**'
      - '.github/workflows/exp109-rgp-pstate-shim.yml'

permissions:
  contents: read

jobs:
  build-shim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and inspect ABI interposer
        run: |
          set -euxo pipefail
          EXP=experiments/EXP-109-RGP-PSTATE-SHIM
          gcc -O2 -fPIC -shared -Wall -Wextra -Werror -o "$EXP/libbc250-rgp-pstate-shim.so" "$EXP/bc250-rgp-pstate-shim.c" -ldl
          test -s "$EXP/libbc250-rgp-pstate-shim.so"
          nm -D "$EXP/libbc250-rgp-pstate-shim.so" | grep ' amdgpu_cs_ctx_stable_pstate$'
          bash -n "$EXP/build-and-test.sh"
